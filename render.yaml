services:
  - type: web
    name: tapnova
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://tapnova2026.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: tapnova-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: PROJECT_TON_WALLET
        sync: false
      - key: JOIN_FEE_NANOTON
        value: "100000000"
      - key: TONAPI_BASE_URL
        value: https://tonapi.io
      - key: TONAPI_TOKEN
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: AIRDROP_RISK_MAX
        value: "80"
      - key: AIRDROP_MIN_SCORE
        value: "1"
      - key: AIRDROP_CLAIM_REQUIRE_JOINED
        value: "false"
      - key: AIRDROP_TOKEN_SYMBOL
        value: "TNV"

databases:
  - name: tapnova-db
    plan: free
    databaseName: tapnova
    user: tapnova
