services:
  - type: web
    name: tapnova
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tapnova-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: PROJECT_TON_WALLET
        sync: false
      - key: JOIN_FEE_NANOTON
        value: "100000000"
      - key: TONAPI_BASE_URL
        value: https://tonapi.io
      - key: TONAPI_TOKEN
        sync: false

databases:
  - name: tapnova-db
    plan: free
    databaseName: tapnova
    user: tapnova
