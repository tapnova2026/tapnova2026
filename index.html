<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapNova</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 { color: #f39c12; margin-bottom: 5px; }
        .welcome-text { font-size: 16px; color: #aaa; margin-bottom: 20px; }
        .score-container { font-size: 32px; font-weight: bold; margin: 20px 0; }
        .tap-btn {
            background: radial-gradient(circle, #f1c40f, #f39c12);
            border: none;
            border-radius: 50%;
            width: 200px;
            height: 200px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            outline: none;
        }
        .tap-btn:active { transform: scale(0.95); }
        .energy-container { font-size: 18px; margin-top: 20px; color: #2ecc71; }
    </style>
</head>
<body>

    <h1>🚀 TapNova</h1>
    <div class="welcome-text" id="welcomeUser">Welcome, Player!</div>
    <p>Tap • Earn • Upgrade</p>

    <div class="score-container">
        💰 <span id="coinsDisplay">0</span>
    </div>

    <button class="tap-btn" id="tapButton">👆 TAP</button>

    <div class="energy-container">
        ⚡ Energy: <span id="energyDisplay">100</span>/100
    </div>

    <script>
        // १. Telegram WebApp Initialization
        const tg = window.Telegram.WebApp;
        
        // सुरक्षित तरिकाले टेलिग्राम कल गर्ने
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // २. User ID सेट गर्ने (यदि टेलिग्राम छैन भने 'local_test_user' बन्नेछ)
        let userId = "tapnova_local_user"; 
        
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            userId = `tapnova_user_${user.id}`;
            document.getElementById("welcomeUser").innerText = `Welcome, ${user.first_name}!`;
        } else {
            document.getElementById("welcomeUser").innerText = "Welcome, Browser Tester!";
        }

        // ३. डाटा लोड गर्ने फङ्सन
        let userStats = { coins: 0, energy: 100 };
        
        try {
            const savedData = localStorage.getItem(userId);
            if (savedData) {
                userStats = JSON.parse(savedData);
            }
        } catch (e) {
            console.log("Error loading storage", e);
        }

        // UI अपडेट गर्ने फङ्सन
        function updateUI() {
            document.getElementById("coinsDisplay").innerText = userStats.coins;
            document.getElementById("energyDisplay").innerText = userStats.energy;
        }

        // डाटा सेभ गर्ने फङ्सन
        function saveData() {
            try {
                localStorage.setItem(userId, JSON.stringify(userStats));
            } catch (e) {
                console.log("Error saving storage", e);
            }
        }

        // ४. Tap गर्दा काम गर्ने मुख्य Setup
        const tapButton = document.getElementById("tapButton");
        tapButton.addEventListener("click", () => {
            if (userStats.energy > 0) {
                userStats.coins += 1;   // १ कोइन बढाउने
                userStats.energy -= 1;  // १ इनर्जी घटाउने
                updateUI();
                saveData();
                
                // टेलिग्राम भित्र भए हल्का भाइब्रेट गराउने
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }
            } else {
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
                alert("Energy सकियो! कृपया रिचार्ज हुन दिनुहोस्।");
            }
        });

        // ५. Energy आफै रिचार्ज हुने (हरेक १ सेकेन्डमा +१ इनर्जी)
        setInterval(() => {
            if (userStats.energy < 100) {
                userStats.energy += 1;
                updateUI();
                saveData();
            }
        }, 1000);

        // सुरुमा गेम लोड हुँदा UI देखाउने
        updateUI();
    </script>
</body>
</html>
