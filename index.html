<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapNova</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 { color: #f39c12; margin-bottom: 5px; }
        .welcome-text { font-size: 16px; color: #aaa; margin-bottom: 20px; }
        .score-container { font-size: 32px; font-weight: bold; margin: 20px 0; }
        .tap-btn {
            background: radial-gradient(circle, #f1c40f, #f39c12);
            border: none;
            border-radius: 50%;
            width: 200px;
            height: 200px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            outline: none;
        }
        .tap-btn:active { transform: scale(0.95); }
        .energy-container { font-size: 18px; margin-top: 20px; color: #2ecc71; }
    </style>
</head>
<body>

    <h1>🚀 TapNova</h1>
    <div class="welcome-text" id="welcomeUser">Welcome, Player!</div>
    <p>Tap • Earn • Upgrade</p>

    <div class="score-container">
        💰 <span id="coinsDisplay">0</span>
    </div>

    <button class="tap-btn" id="tapButton">👆 TAP</button>

    <div class="energy-container">
        ⚡ Energy: <span id="energyDisplay">100</span>/100
    </div>

    <script>
        // Initialize Telegram WebApp safely
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Setup User ID
        let userId = "tapnova_local_user"; 
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = "tapnova_user_" + tg.initDataUnsafe.user.id;
            document.getElementById("welcomeUser").innerText = "Welcome, " + tg.initDataUnsafe.user.first_name + "!";
        } else {
            document.getElementById("welcomeUser").innerText = "Welcome, Tester!";
        }

        // Default stats
        let userStats = { coins: 0, energy: 100 };

        // Load data safely
        try {
            const savedData = localStorage.getItem(userId);
            if (savedData) {
                userStats = JSON.parse(savedData);
            }
        } catch (e) {
            console.error("Storage load error", e);
        }

        // Update UI Function
        function updateUI() {
            document.getElementById("coinsDisplay").innerText = userStats.coins;
            document.getElementById("energyDisplay").innerText = userStats.energy;
        }

        // Save Data Function
        function saveData() {
            try {
                localStorage.setItem(userId, JSON.stringify(userStats));
            } catch (e) {
                console.error("Storage save error", e);
            }
        }

        // Tap Event
        document.getElementById("tapButton").onclick = function() {
            if (userStats.energy > 0) {
                userStats.coins += 1;
                userStats.energy -= 1;
                updateUI();
                saveData();
                
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }
            } else {
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
                alert("Out of Energy! Please wait for recharge.");
            }
        };

        // Energy Recharge (Every 1 second)
        setInterval(function() {
            if (userStats.energy < 100) {
                userStats.energy += 1;
                updateUI();
                saveData();
            }
        }, 1000);

        // Initial UI Load
        updateUI();
    </script>
</body>
</html>
